[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gazoken"
version = "0.5.0"
description = "Local image-forensics research workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
gazoken = "gazoken.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gazoken = ["web/*"]
